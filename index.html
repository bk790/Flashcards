<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Introduction to AI Flashcards</title><link rel="stylesheet" href="style.css"></head>
<body><header><p>STUDY • REVISE • REMEMBER</p><h1>Introduction to AI</h1><span>Interactive assignment revision flashcards</span></header>
<main><div class="toolbar"><label>Module <select id="filter"><option>All</option><option>Module 1</option><option>Module 2</option><option>Module 3</option></select></label><button id="shuffle" class="light">Shuffle</button><button id="reset" class="light">Reset progress</button></div>
<div class="progress"><div><span id="count"></span><span id="percent"></span></div><div class="track"><div id="bar"></div></div><p>Known: <b id="known">0</b> &nbsp; Need revision: <b id="review">0</b></p></div>
<button id="card" class="card"><span id="module" class="tag"></span><small id="label">QUESTION</small><strong id="content"></strong><small id="hint">Tap to reveal answer</small></button>
<div class="controls"><button id="prev" class="light">← Previous</button><button id="reveal">Reveal answer</button><button id="next" class="light">Next →</button></div>
<div class="controls"><button id="missed" class="orange">Need revision</button><button id="mastered" class="green">I know this</button></div>
<p class="note">Progress is saved only in this browser on this device; it is not shared between students.</p></main><footer>Introduction to AI • Flashcard revision</footer><script src="script.js"></script></body></html>
